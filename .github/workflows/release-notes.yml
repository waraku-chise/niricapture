name: Sync release notes

# Update an existing GitHub Release body from .github/release-notes/<tag>.md.
# The release itself is created by build-linux.yml when a v* tag is pushed.

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/**.md"
      - ".github/workflows/release-notes.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Update v1.0.0 release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NiriCapture 1.0.0
          body_path: .github/release-notes/v1.0.0.md
          draft: false
          prerelease: false
