name: Sync v1.0.0 release notes

# One-off: keep the v1.0.0 release body in sync with its note file.
# The release itself and its assets are still produced by build-linux.yml
# when a v* tag is pushed. Future releases can add their own note file + job.

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/v1.0.0.md"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Update v1.0.0 release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NiriCapture 1.0.0
          body_path: .github/release-notes/v1.0.0.md
          draft: false
          prerelease: false
